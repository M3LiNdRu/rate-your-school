openapi: 3.0.3
info:
  title: RateYourSchool API
  description: |
    RESTful API for rating and reviewing schools. This API enables users to browse schools,
    view ratings and reviews, and submit their own reviews anonymously.
    
    ## Architecture
    - CQRS pattern with read/write model separation
    - MongoDB for data persistence
    - Eventual consistency between write and read models
    
    ## Authentication
    - Most endpoints are anonymous (no authentication required)
    - Future versions may include authentication for specific operations
    
  version: 1.0.0
  contact:
    name: RateYourSchool Team
    url: https://github.com/OWNER/RateYourSchool
  license:
    name: See COPYING file
    url: https://github.com/OWNER/RateYourSchool/blob/main/COPYING

servers:
  - url: https://api.rateyourschool.com/v1
    description: Production server
  - url: http://localhost:5001/v1
    description: Development server

tags:
  - name: Schools
    description: School information and ratings
  - name: Reviews
    description: User reviews for schools
  - name: Health
    description: API health and status

paths:
  /api/v1/schools:
    get:
      summary: Get list of school rates
      description: |
        Retrieves a paginated list of school rates with comprehensive information
        including school details, aggregated scores, and the last 25 user reviews
        per school.

        **CQRS Note:** This endpoint reads from the SchoolRate read model
        (MongoDB `schoolRates` collection), not the School write model.

        **Business Rules:**
        - BR-024: Pagination support via `page` and `pageSize` query parameters
        - BR-025: Default to page=1 and pageSize=20 when not specified
        - BR-026: Page numbers < 1 are automatically corrected to 1
        - BR-027: pageSize is clamped to the range [1, 1000]
        - BR-028: Each school includes Info, Score, and up to 25 Reviews
        - BR-012: Maximum of 25 most-recent reviews are included per school
      operationId: getSchoolRates
      tags:
        - Schools
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successfully retrieved school rates list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSchoolRatesResponse'
              examples:
                withSchools:
                  summary: Response containing school rates
                  value:
                    schools:
                      - info:
                          name: "Maple Leaf Elementary"
                          address: "123 Main St, Toronto, ON"
                          imageUrl: "https://example.com/maple-leaf.jpg"
                        score:
                          innovation: 4.5
                          building: 4.2
                          professorate: 4.6
                          managementTeam: 4.3
                          total: 4.4
                        reviews:
                          - userName: "JohnDoe"
                            comment: "Excellent school with great teachers!"
                            rating: 5.0
                          - userName: "JaneSmith"
                            comment: "Good facilities and programs"
                            rating: 4.0
                      - info:
                          name: "Oak Grove High"
                          address: "456 Oak Ave, Toronto, ON"
                          imageUrl: "https://example.com/oak-grove.jpg"
                        score:
                          innovation: 3.8
                          building: 3.9
                          professorate: 3.7
                          managementTeam: 3.8
                          total: 3.8
                        reviews: []
                empty:
                  summary: Empty response when no schools exist
                  value:
                    schools: []
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    GetSchoolRatesResponse:
      type: object
      description: Paginated list of school rates
      required:
        - schools
      properties:
        schools:
          type: array
          description: List of school rate view models (BR-028)
          items:
            $ref: '#/components/schemas/SchoolViewModel'

    SchoolViewModel:
      type: object
      description: |
        Denormalized school rate view model combining school information,
        aggregated scores, and recent reviews (BR-009, BR-028).
      required:
        - info
        - score
        - reviews
      properties:
        info:
          $ref: '#/components/schemas/SchoolInfo'
        score:
          $ref: '#/components/schemas/Score'
        reviews:
          type: array
          description: Last 25 user reviews ordered by date descending (BR-012)
          maxItems: 25
          items:
            $ref: '#/components/schemas/UserReview'

    SchoolInfo:
      type: object
      description: Basic school information (BR-028)
      required:
        - name
        - address
        - imageUrl
      properties:
        name:
          type: string
          description: School name
          example: "Maple Leaf Elementary"
        address:
          type: string
          description: Full physical address
          example: "123 Main St, Toronto, ON"
        imageUrl:
          type: string
          format: uri
          description: URL to the school's image
          example: "https://example.com/maple-leaf.jpg"

    Score:
      type: object
      description: |
        Multi-dimensional aggregated score for a school (BR-016, BR-017, BR-018).
        Total is the arithmetic mean of the four dimensions.
      required:
        - innovation
        - building
        - professorate
        - managementTeam
        - total
      properties:
        innovation:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: Assessment of innovative practices (BR-016)
          example: 4.5
        building:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: Evaluation of facilities and infrastructure (BR-016)
          example: 4.2
        professorate:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: Rating of teaching staff quality (BR-016)
          example: 4.6
        managementTeam:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: Evaluation of administrative leadership (BR-016)
          example: 4.3
        total:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: |
            Arithmetic mean of all four dimensions:
            (Innovation + Building + Professorate + ManagementTeam) / 4 (BR-017)
          example: 4.4

    UserReview:
      type: object
      description: Anonymous user review for a school (BR-036, BR-038)
      required:
        - userName
        - comment
        - rating
      properties:
        userName:
          type: string
          description: Reviewer's username (anonymous, no account required - BR-038)
          example: "JohnDoe"
        comment:
          type: string
          description: Text feedback from the reviewer
          example: "Great school with excellent facilities"
        rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          description: Numerical rating given by the reviewer
          example: 4.5

    Error:
      type: object
      description: Standard error response
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code or type
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid request parameters"
        details:
          type: array
          description: Detailed validation errors (optional)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "VALIDATION_ERROR"
            message: "Invalid request parameters"
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "NOT_FOUND"
            message: "The requested resource was not found"
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "INTERNAL_ERROR"
            message: "An unexpected error occurred"
  
  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    
    PageSize:
      name: pageSize
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
      example: 20
