arazzo: 1.0.0
info:
  title: RateYourSchool API Workflows
  description: |
    End-to-end workflows for the RateYourSchool API demonstrating common use cases
    and API integration patterns.
    
    These workflows show how to:
    - Browse and search schools
    - View school details and ratings
    - Submit anonymous reviews
    - Navigate the API effectively
    
  version: 1.0.0
  contact:
    name: RateYourSchool Team
    url: https://github.com/OWNER/RateYourSchool

sourceDescriptions:
  - name: rateyourschool-api
    url: ./openapi.yaml
    type: openapi
    description: RateYourSchool OpenAPI specification

workflows:
  - workflowId: browse-schoolrates
    summary: Browse school rates with pagination
    description: |
      End-to-end workflow demonstrating how to browse and paginate through
      the list of school rates. This workflow covers the initial page load
      and subsequent page navigation.

      **Use Case:** UC-003 (View School Details)
      **Business Rules:** BR-024 through BR-028
    inputs:
      type: object
      properties:
        initialPage:
          type: integer
          default: 1
          description: Starting page number (BR-025)
        initialPageSize:
          type: integer
          default: 20
          description: Number of schools per page (BR-025)
    steps:
      - stepId: list-schoolrates-first-page
        summary: Retrieve initial list of school rates
        description: |
          Fetches the first page of school rates. Page numbers below 1 are
          automatically corrected to 1 (BR-026). Page size is clamped to
          [1, 1000] (BR-027).
        operationId: rateyourschool-api.getSchoolRates
        parameters:
          - name: page
            in: query
            value: $inputs.initialPage
          - name: pageSize
            in: query
            value: $inputs.initialPageSize
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.schools != null
        outputs:
          schoolsList: $response.body.schools
          schoolCount: $response.body.schools.length

      - stepId: list-schoolrates-next-page
        summary: Load the next page of school rates
        description: |
          Fetches the next page of school rates for pagination navigation.
          Demonstrates how pagination parameters work together (BR-024).
        operationId: rateyourschool-api.getSchoolRates
        parameters:
          - name: page
            in: query
            value: $inputs.initialPage + 1
          - name: pageSize
            in: query
            value: $inputs.initialPageSize
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          nextPageSchools: $response.body.schools

    outputs:
      initialSchools: $steps.list-schoolrates-first-page.outputs.schoolsList
      schoolCount: $steps.list-schoolrates-first-page.outputs.schoolCount
      nextPageSchools: $steps.list-schoolrates-next-page.outputs.nextPageSchools
